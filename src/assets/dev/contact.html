<!doctype html>
<html><head><meta charset="utf-8"><title>contact</title>
<style>
  body{margin:0;background:#222;font:12px system-ui;color:#fff}
  #r{display:grid;grid-template-columns:repeat(9,195px);gap:6px;padding:6px}
  .c{position:relative;width:195px;height:422px;overflow:hidden;background:#000}
  .c svg{width:100%;height:100%;display:block}
  .l{position:absolute;left:2px;top:2px;background:#000a;padding:1px 3px;font-size:10px}
  .sc{position:absolute;inset:66% 0 0 0;background:linear-gradient(to top,rgba(11,11,15,.7),rgba(11,11,15,0))}
  .sc2{position:absolute;inset:0 0 0 62%;background:linear-gradient(to left,rgba(11,11,15,.4),rgba(11,11,15,0))}
  .cap{position:absolute;left:8px;bottom:34px;right:44px;color:#f5f5f7;font-size:11px;line-height:1.3}
  .rail{position:absolute;right:8px;bottom:34px;color:#f5f5f7;font-size:11px;text-align:center}
</style></head>
<body><div id="r"></div><script type="module" src="./contact.tsx"></script></body></html>
