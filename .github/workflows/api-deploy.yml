# Deploy the shared API. One function app serves every game, so this runs
# on changes under api/ only and is deliberately decoupled from any single
# game's release.

name: api

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - '.github/workflows/api-deploy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'api/**'

permissions:
  id-token: write
  contents: read

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: false

env:
  FUNCTION_APP_NAME: func-aigames-api-prod
  API_PATH: api
  NODE_VERSION: '20'

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.API_PATH }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.API_PATH }}/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Token validation is the only thing standing between a player's saves
      # and everyone else's. It gets tests, and they run before every deploy.
      - run: npm test

  deploy:
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.API_PATH }}/package-lock.json

      - name: Install production dependencies
        working-directory: ${{ env.API_PATH }}
        run: npm ci --omit=dev

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.FUNCTION_APP_NAME }}
          package: ${{ env.API_PATH }}
          # No publish-profile: that is a long-lived credential. The OIDC
          # login above is the authentication.

      - name: Confirm the API rejects an unauthenticated call
        run: |
          set -euo pipefail
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://${FUNCTION_APP_NAME}.azurewebsites.net/api/state")
          echo "unauthenticated GET returned $code"
          if [ "$code" != "401" ] && [ "$code" != "403" ]; then
            echo "::error::API answered an unauthenticated request with $code"
            exit 1
          fi
